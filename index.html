<style>
:root{
    --primary:#1a1a2e;
    --accent:#e94560;
    --accent2:#f5a623;
    --bg:#0f0f23;
    --card-bg:#16213e;
    --card-border:#1a1a3e;
    --text:#e8e8f0;
    --text-muted:#8888aa;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}

/* FanGenie banner */
.fangenie-banner{
    background:linear-gradient(90deg,#1a1a3e 0%,#22224a 100%);
    border-bottom:1px solid var(--card-border);
    padding:8px 16px;
    text-align:center;
    font-size:13px;
}
.fangenie-banner a{
    display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
}
.fangenie-banner .powered-by{color:var(--text-muted);font-weight:500;}
.fangenie-banner .fg-logo{height:18px;width:auto;display:inline-block;}
.fangenie-banner .fg-tagline{color:var(--text);font-weight:500;}

/* Header */
.site-header{
    padding:20px 24px;
    border-bottom:1px solid var(--card-border);
    background:rgba(15,15,35,0.95);
    position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
}
.site-header-inner{
    max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{
    font-family:'Montserrat',sans-serif;
    font-weight:800;font-size:22px;letter-spacing:-0.5px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
}
.event-count{color:var(--text-muted);font-size:14px;font-weight:500;}
.event-count strong{color:var(--text);font-weight:700;}

/* Hero */
.hero{
    padding:48px 24px 24px;text-align:center;
}
.hero h1{
    font-family:'Montserrat',sans-serif;font-weight:800;
    font-size:clamp(28px,5vw,44px);letter-spacing:-1px;
    background:linear-gradient(120deg,#fff 0%,#c9c9e6 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:8px;
}
.hero p{color:var(--text-muted);font-size:16px;max-width:560px;margin:0 auto;}

/* Filters */
.filters{
    max-width:1280px;margin:24px auto;padding:0 24px;
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;
}
.filters input,.filters select{
    background:var(--card-bg);border:1px solid var(--card-border);color:var(--text);
    padding:12px 16px;border-radius:8px;font-family:inherit;font-size:14px;
    transition:border-color .15s ease;
}
.filters input{flex:1 1 260px;min-width:180px;}
.filters input::placeholder{color:var(--text-muted);}
.filters select{flex:0 0 180px;cursor:pointer;}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent);}
.filters .clear-btn{
    background:transparent;border:1px solid var(--card-border);color:var(--text-muted);
    padding:12px 20px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:500;
    cursor:pointer;transition:all .15s ease;
}
.filters .clear-btn:hover{color:var(--text);border-color:var(--accent);}

/* Events grid */
.events{
    max-width:1280px;margin:0 auto;padding:0 24px 64px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;
}
.empty{
    grid-column:1/-1;text-align:center;padding:48px 24px;color:var(--text-muted);
}
.card{
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.45);border-color:var(--accent);}
.card-photo-wrap{
    position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--primary);
}
.card-photo-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
}
.card-photo-fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;
    text-shadow:0 2px 8px rgba(0,0,0,.55);padding:16px;letter-spacing:-0.5px;line-height:1.2;
}
.card-body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-artist{
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;
    color:var(--text);letter-spacing:-0.3px;line-height:1.25;
}
.card-meta{
    display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--text-muted);
}
.card-meta .row{display:flex;gap:6px;align-items:flex-start;}
.card-meta .ico{flex:0 0 auto;width:14px;color:var(--accent);margin-top:2px;}
.card-date{color:var(--accent2);font-weight:600;}
.card-cta{
    margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(90deg,var(--accent) 0%,#ff6b81 100%);
    color:#fff;font-weight:600;font-size:14px;padding:10px 14px;border-radius:8px;
    transition:transform .12s ease,filter .12s ease;
}
.card-cta:hover{transform:translateY(-1px);filter:brightness(1.08);}

/* Footer */
.site-footer{
    padding:24px;text-align:center;color:var(--text-muted);font-size:13px;
    border-top:1px solid var(--card-border);
}

@media (max-width:520px){
    .filters select{flex:1 1 100%;}
    .events{grid-template-columns:1fr;}
}
</style>
</head>

const GRADIENTS = [
    'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',
    'linear-gradient(135deg,#f093fb 0%,#f5576c 100%)',
    'linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)',
    'linear-gradient(135deg,#fa709a 0%,#fee140 100%)',
    'linear-gradient(135deg,#30cfd0 0%,#330867 100%)',
    'linear-gradient(135deg,#a8edea 0%,#fed6e3 100%)',
    'linear-gradient(135deg,#ff9a9e 0%,#fecfef 100%)',
    'linear-gradient(135deg,#43e97b 0%,#38f9d7 100%)',
    'linear-gradient(135deg,#fa8bff 0%,#2bd2ff 50%,#2bff88 100%)',
    'linear-gradient(135deg,#ee9ca7 0%,#ffdde1 100%)'
];

function gradientFor(slug){
    let h = 0;
    for(let i=0;i<slug.length;i++){ h = (h*31 + slug.charCodeAt(i)) >>> 0; }
    return GRADIENTS[h % GRADIENTS.length];
}

function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

function escapeAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }

function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}

function renderCard(e){
    const grad = gradientFor(e.slug || e.artist);
    const artistEsc = escapeHtml(e.artist);
    const slugEsc = escapeAttr(e.slug);
    const cityState = [e.city, e.state].filter(Boolean).join(', ');
    const dateLine = formatDate(e.date) + (e.showtime ? ' &middot; ' + escapeHtml(e.showtime) : '');
    return `
    <article class="card">
        <div class="card-photo-wrap">
            <img src="${PHOTO_BASE}${slugEsc}.jpg" alt="${artistEsc}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-photo-fallback" style="display:none;background:${grad}">${artistEsc}</div>
        </div>
        <div class="card-body">
            <div class="card-artist">${artistEsc}</div>
            <div class="card-meta">
                <div class="row card-date"><span class="ico">&#x1F4C5;</span><span>${dateLine}</span></div>
                ${cityState ? `<div class="row"><span class="ico">&#x1F4CD;</span><span>${escapeHtml(cityState)}</span></div>` : ''}
                ${e.location ? `<div class="row"><span class="ico">&#x1F3DB;</span><span>${escapeHtml(e.location)}</span></div>` : ''}
            </div>
            <a class="card-cta" href="${escapeAttr(e.ticket)}" target="_blank" rel="noopener">Get Tickets &rarr;</a>
        </div>
    </article>`;
}

const grid = document.getElementById('eventsGrid');
const searchInput = document.getElementById('searchInput');
const stateSelect = document.getElementById('stateSelect');
const eventCount = document.getElementById('eventCount');
const clearBtn = document.getElementById('clearBtn');

function render(){
    const q = searchInput.value.trim().toLowerCase();
    const st = stateSelect.value;
    const filtered = events.filter(e => {
        if(st && e.state !== st) return false;
        if(!q) return true;
        return (
            (e.artist||'').toLowerCase().includes(q) ||
            (e.city||'').toLowerCase().includes(q) ||
            (e.location||'').toLowerCase().includes(q) ||
            (e.state||'').toLowerCase().includes(q)
        );
    });
    eventCount.textContent = filtered.length;
    if(filtered.length === 0){
        grid.innerHTML = '<div class="empty">No shows match your filters yet. Try clearing them or check back soon.</div>';
        return;
    }
    grid.innerHTML = filtered.map(renderCard).join('');
}

searchInput.addEventListener('input', render);
stateSelect.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    stateSelect.value = '';
    render();
});

document.getElementById('year').textContent = new Date().getFullYear();
render();
</script>
