<style>
:root {
  --primary: #1a1a2e;
  --accent: #e94560;
  --accent2: #f5a623;
  --bg: #0f0f23;
  --card-bg: #16213e;
  --card-border: #1a1a3e;
  --text: #e8e8f0;
  --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
.fangenie-banner {
  background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%);
  padding: 10px 16px;
  text-align: center;
  border-bottom: 1px solid #2a2a4e;
}
.fangenie-banner a {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--text); text-decoration: none; flex-wrap: wrap; justify-content: center;
}
.fangenie-banner .powered-by { font-size: 12px; color: var(--text-muted); }
.fangenie-banner .fg-logo { height: 22px; vertical-align: middle; }
.fangenie-banner .fg-tagline { font-size: 12px; color: var(--text-muted); }
header {
  background: linear-gradient(180deg, var(--primary) 0%, var(--bg) 100%);
  padding: 28px 16px 0;
  text-align: center;
}
.brand {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: clamp(28px, 5vw, 44px);
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.event-count {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 8px;
}
.hero {
  padding: 32px 16px 16px;
  text-align: center;
  max-width: 980px;
  margin: 0 auto;
}
.hero h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 700;
  margin-bottom: 8px;
}
.hero p { color: var(--text-muted); font-size: 16px; }
.controls {
  max-width: 1200px;
  margin: 16px auto 0;
  padding: 0 16px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
}
.controls input, .controls select, .controls button {
  font-family: inherit;
  font-size: 15px;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--text);
  outline: none;
  transition: border-color .15s ease;
}
.controls input { flex: 1 1 260px; min-width: 220px; }
.controls select { flex: 0 0 auto; min-width: 140px; }
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.controls button {
  background: var(--accent); border-color: var(--accent); cursor: pointer; font-weight: 600;
}
.controls button:hover { background: #d63a55; border-color: #d63a55; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
.results-meta {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 14px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(233, 69, 96, .15);
}
.card-photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #1a1a3e;
}
.card-photo-wrap img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.card-photo-fallback {
  position: absolute; inset: 0;
  align-items: center; justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  text-align: center;
  padding: 16px;
  text-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.card-artist {
  font-family: 'Montserrat', sans-serif;
  font-size: 17px; font-weight: 700; line-height: 1.25;
  color: var(--text); margin-bottom: 4px;
}
.card-date { color: var(--accent2); font-weight: 600; font-size: 14px; }
.card-time { color: var(--text-muted); font-size: 13px; }
.card-location { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.card-city { color: var(--text); font-size: 13px; font-weight: 500; }
.card-actions { margin-top: auto; padding-top: 12px; }
.btn-tix {
  display: block; text-align: center;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: #fff; text-decoration: none;
  padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 14px;
  transition: opacity .15s ease;
}
.btn-tix:hover { opacity: .92; }
.platform-tag {
  display: inline-block;
  font-size: 11px; color: var(--text-muted);
  margin-top: 6px; text-transform: uppercase; letter-spacing: .04em;
}
.no-results {
  text-align: center; color: var(--text-muted);
  padding: 60px 20px; font-size: 16px;
}
footer {
  text-align: center; padding: 24px 16px;
  color: var(--text-muted); font-size: 13px;
  border-top: 1px solid var(--card-border);
}
footer a { color: var(--accent2); text-decoration: none; }
</style>

const GRADIENTS = [
  'linear-gradient(135deg,#667eea,#764ba2)',
  'linear-gradient(135deg,#f093fb,#f5576c)',
  'linear-gradient(135deg,#4facfe,#00f2fe)',
  'linear-gradient(135deg,#43e97b,#38f9d7)',
  'linear-gradient(135deg,#fa709a,#fee140)',
  'linear-gradient(135deg,#30cfd0,#330867)',
  'linear-gradient(135deg,#a8edea,#fed6e3)',
  'linear-gradient(135deg,#ff9a9e,#fad0c4)',
  'linear-gradient(135deg,#84fab0,#8fd3f4)',
  'linear-gradient(135deg,#fccb90,#d57eeb)'
];
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h);
}
function gradFor(slug) { return GRADIENTS[hashStr(slug) % GRADIENTS.length]; }

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function renderCards(list) {
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="no-results">No shows match your search. Try clearing filters.</div>';
    return;
  }
  grid.innerHTML = list.map(e => {
    const grad = gradFor(e.slug);
    const cityState = [e.city, e.state].filter(Boolean).join(', ');
    return `
      <article class="card">
        <div class="card-photo-wrap">
          <img src="${PHOTO_BASE}${esc(e.slug)}.jpg" alt="${esc(e.artist)}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="card-photo-fallback" style="display:none;background:${grad}">${esc(e.artist)}</div>
        </div>
        <div class="card-body">
          <div class="card-artist">${esc(e.artist)}</div>
          <div class="card-date">${fmtDate(e.date)}${e.showtime ? ' &middot; ' + esc(e.showtime) : ''}</div>
          ${cityState ? `<div class="card-city">${esc(cityState)}</div>` : ''}
          ${e.location ? `<div class="card-location">${esc(e.location)}</div>` : ''}
          <div class="card-actions">
            <a class="btn-tix" href="${esc(e.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
            ${e.platform ? `<div class="platform-tag">via ${esc(e.platform)}</div>` : ''}
          </div>
        </div>
      </article>`;
  }).join('');
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('stateFilter').value;
  const filtered = events.filter(e => {
    if (st && e.state !== st) return false;
    if (!q) return true;
    const hay = (e.artist + ' ' + e.city + ' ' + e.state + ' ' + e.location).toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('resultsMeta').textContent = `Showing ${filtered.length} of ${events.length} shows`;
  renderCards(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('stateFilter').addEventListener('change', applyFilters);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('stateFilter').value = '';
  applyFilters();
});
document.getElementById('year').textContent = new Date().getFullYear();
applyFilters();
</script>
