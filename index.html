<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --bg: #0f0f23;
    --card-bg: #16213e;
    --card-border: #1a1a3e;
    --text: #e8e8f0;
    --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

/* FanGenie banner */
.fangenie-banner {
    background: linear-gradient(90deg, #1a1a2e 0%, #2d1b3d 100%);
    border-bottom: 1px solid rgba(233,69,96,0.25);
    padding: 8px 16px;
    text-align: center;
    font-size: 13px;
}
.fangenie-banner a { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; color: #e8e8f0; }
.fangenie-banner .powered-by { color: var(--text-muted); font-weight: 500; }
.fangenie-banner .fg-logo { height: 22px; width: auto; vertical-align: middle; }
.fangenie-banner .fg-tagline { color: var(--accent2); font-weight: 600; }
.fangenie-banner a:hover .fg-tagline { color: #ffd16e; }

/* Header */
.site-header { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px; max-width: 1400px; margin: 0 auto; gap: 16px; flex-wrap: wrap; }
.logo { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.event-count { color: var(--text-muted); font-size: 14px; font-weight: 500; }

/* Hero */
.hero { text-align: center; padding: 48px 24px 32px; max-width: 900px; margin: 0 auto; }
.hero h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 48px); letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 12px; }
.hero p { color: var(--text-muted); font-size: 17px; max-width: 600px; margin: 0 auto; }

/* Controls */
.controls { max-width: 1100px; margin: 0 auto 28px; padding: 0 24px; display: grid; grid-template-columns: 1fr 220px auto; gap: 12px; }
.controls input, .controls select, .controls button {
    background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.controls input:focus, .controls select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233,69,96,0.15); }
.controls input::placeholder { color: var(--text-muted); }
.btn-clear { cursor: pointer; background: transparent; color: var(--accent); border-color: rgba(233,69,96,0.4); font-weight: 600; padding: 12px 18px; }
.btn-clear:hover { background: rgba(233,69,96,0.1); }
@media (max-width: 720px) { .controls { grid-template-columns: 1fr; } }

/* Grid */
.events-grid { max-width: 1400px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }

/* Card */
.event-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    position: relative;
}
.event-card:hover { transform: translateY(-4px); border-color: rgba(233,69,96,0.5); box-shadow: 0 12px 32px rgba(0,0,0,0.45); }

.card-photo-wrap {
    aspect-ratio: 16/9; overflow: hidden; position: relative; background: #0e1730;
}
.card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-fallback {
    width: 100%; height: 100%;
    display: none;
    align-items: center; justify-content: center;
    text-align: center; padding: 14px;
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 22px; line-height: 1.15; letter-spacing: -0.01em;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    position: absolute; inset: 0;
}

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-artist { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--text); }
.card-meta { color: var(--text-muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.card-date { color: var(--accent2); font-weight: 600; font-size: 14px; }
.card-where { color: var(--text); font-size: 14px; }
.card-loc { color: var(--text-muted); font-size: 13px; }
.card-platform { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.card-cta { margin-top: auto; padding-top: 14px; }
.btn-tickets {
    display: block; text-align: center;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff; font-weight: 700; padding: 11px 14px; border-radius: 10px;
    font-size: 14px; letter-spacing: 0.02em;
    transition: opacity 0.15s, transform 0.15s;
}
.btn-tickets:hover { opacity: 0.95; transform: translateY(-1px); }

/* Empty state */
.empty { text-align: center; padding: 60px 24px; color: var(--text-muted); grid-column: 1 / -1; }

/* Footer */
.site-footer { text-align: center; padding: 28px 24px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--card-border); }
</style>

// 10-color gradient palette
const PALETTE = [
    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
    'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
    'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
    'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
    'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
    'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)',
    'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)',
];

function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
}

function gradientFor(slug) {
    return PALETTE[hashStr(slug) % PALETTE.length];
}

function escapeHTML(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeAttr(s) {
    return escapeHTML(s).replace(/\n/g, ' ');
}

function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    if (!y) return iso;
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

function renderCard(e) {
    const grad = gradientFor(e.slug);
    const photo = PHOTO_BASE + e.slug + '.jpg';
    const where = [e.city, e.state].filter(Boolean).join(', ');
    const dateLabel = e.show_info && e.show_info.trim() ? e.show_info : formatDate(e.date);
    const loc = e.location && e.location.trim() && e.location.trim() !== ',' ? e.location : '';

    return `
    <article class="event-card">
        <div class="card-photo-wrap">
            <img src="${escapeAttr(photo)}" alt="${escapeAttr(e.artist)}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-photo-fallback" style="display:none;background:${grad}">${escapeHTML(e.artist)}</div>
        </div>
        <div class="card-body">
            <div class="card-artist">${escapeHTML(e.artist)}</div>
            <div class="card-meta">
                <div class="card-date">${escapeHTML(dateLabel)}${e.showtime ? ' &middot; ' + escapeHTML(e.showtime) : ''}</div>
                ${where ? `<div class="card-where">${escapeHTML(where)}</div>` : ''}
                ${loc ? `<div class="card-loc">${escapeHTML(loc)}</div>` : ''}
                ${e.platform ? `<div class="card-platform">${escapeHTML(e.platform)}</div>` : ''}
            </div>
            <div class="card-cta">
                <a class="btn-tickets" href="${escapeAttr(e.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
            </div>
        </div>
    </article>`;
}

const grid = document.getElementById('eventsGrid');
const search = document.getElementById('searchInput');
const stateSel = document.getElementById('stateSelect');
const countEl = document.getElementById('eventCount');
const clearBtn = document.getElementById('clearBtn');

function applyFilters() {
    const q = search.value.trim().toLowerCase();
    const st = stateSel.value;
    const filtered = events.filter(e => {
        if (st && e.state !== st) return false;
        if (q) {
            const hay = [e.artist, e.city, e.state, e.location, e.platform].filter(Boolean).join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    });

    countEl.textContent = filtered.length + ' upcoming show' + (filtered.length === 1 ? '' : 's');
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No shows match your filters. Try clearing them.</div>';
        return;
    }
    grid.innerHTML = filtered.map(renderCard).join('');
}

search.addEventListener('input', applyFilters);
stateSel.addEventListener('change', applyFilters);
clearBtn.addEventListener('click', () => {
    search.value = ''; stateSel.value = ''; applyFilters();
});

applyFilters();
</script>

</body>
</html>
