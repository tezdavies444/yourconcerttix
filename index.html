<style>
:root {

}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; min-height: 100%; }
a { color: inherit; text-decoration: none; }
.fangenie-banner {
    background: linear-gradient(90deg, #0b0b1f 0%, #181838 100%);
    border-bottom: 1px solid #25254a;
    padding: 10px 16px;
    text-align: center;
}
.fangenie-banner a { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.fangenie-banner .powered-by { color: var(--text-muted); font-size: 13px; font-weight: 500; }
.fangenie-banner .fg-logo { height: 22px; vertical-align: middle; }
.fangenie-banner .fg-tagline { color: var(--text); font-size: 13px; font-weight: 500; }
.header {

}
.logo {

    letter-spacing: -0.5px;

    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
}
.event-count { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
.hero {
    text-align: center;
    padding: 40px 20px 26px;
}
.hero h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
}
.hero p { color: var(--text-muted); font-size: 16px; }
.controls {
    max-width: 1200px;
    margin: 0 auto 28px;
    padding: 0 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}
.controls input, .controls select {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 8px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
}
.controls input { flex: 1 1 280px; min-width: 180px; }
.controls select { min-width: 160px; }
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.controls .clear-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 12px 18px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
}
.controls .clear-btn:hover { color: var(--text); border-color: var(--accent); }
.grid-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
}
.card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 30px -10px rgba(233,69,96,0.35); }
.card-photo-wrap {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
    background: #0b0b22;
}
.card-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.card-photo-fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 14px;
    line-height: 1.2;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; flex: 1; }
.card-artist {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 8px;
    color: var(--text);
}
.card-meta { color: var(--text-muted); font-size: 13.5px; margin-bottom: 4px; display: flex; gap: 6px; align-items: flex-start; }
.card-meta strong { color: var(--text); font-weight: 600; }
.card-loc { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; min-height: 18px; }
.card-cta {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff;
    padding: 11px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.2px;
    transition: filter 0.15s, transform 0.15s;
}
.card-cta:hover { filter: brightness(1.1); transform: translateY(-1px); }
.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}
.footer {
    border-top: 1px solid #1a1a3e;
    padding: 22px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
}
@media (max-width: 600px) {
    .header { padding: 18px 16px 6px; }
    .hero { padding: 28px 16px 18px; }
    .controls { padding: 0 16px; }
    .grid-wrap { padding: 0 16px 40px; }
}
</style>

document.getElementById('year').textContent = new Date().getFullYear();

const GRADIENT_PALETTE = [
    ['#e94560', '#f5a623'],
    ['#5e60ce', '#48bfe3'],
    ['#06d6a0', '#118ab2'],
    ['#ef476f', '#ffd166'],
    ['#7209b7', '#3a0ca3'],
    ['#f72585', '#b5179e'],
    ['#ff9e00', '#ff0054'],
    ['#2ec4b6', '#0077b6'],
    ['#fb8500', '#ffb703'],
    ['#9d4edd', '#5a189a']
];

function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h);
}

function gradientFor(slug) {
    const idx = hashStr(slug) % GRADIENT_PALETTE.length;
    const [a, b] = GRADIENT_PALETTE[idx];
    const angle = (hashStr(slug + 'x') % 360);
    return `linear-gradient(${angle}deg, ${a} 0%, ${b} 100%)`;
}

function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(n => parseInt(n, 10));
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeAttr(s) { return escapeHtml(s); }

function renderCard(e) {
    const grad = gradientFor(e.slug);
    const cityState = [e.city, e.state].filter(Boolean).join(', ');
    const venue = e.location || '';
    const dateStr = fmtDate(e.date);
    const showtime = e.showtime ? ` &middot; ${escapeHtml(e.showtime)}` : '';
    return `
    <article class="card">
        <div class="card-photo-wrap">
            <img src="${PHOTO_BASE}${escapeAttr(e.slug)}.jpg" alt="${escapeAttr(e.artist)}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-photo-fallback" style="background:${grad}">${escapeHtml(e.artist)}</div>
        </div>
        <div class="card-body">
            <div class="card-artist">${escapeHtml(e.artist)}</div>
            <div class="card-meta"><strong>${escapeHtml(dateStr)}</strong>${showtime}</div>
            <div class="card-meta">${escapeHtml(cityState)}</div>
            <div class="card-loc">${escapeHtml(venue)}</div>
            <a class="card-cta" href="${escapeAttr(e.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
        </div>
    </article>`;
}

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const searchInput = document.getElementById('search');
const stateSel = document.getElementById('state-filter');
const clearBtn = document.getElementById('clear-btn');
const countEl = document.getElementById('event-count');

function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    const st = stateSel.value;
    const filtered = events.filter(e => {
        if (st && e.state !== st) return false;
        if (!q) return true;
        const hay = [e.artist, e.city, e.state, e.location, e.platform].join(' ').toLowerCase();
        return hay.includes(q);
    });
    grid.innerHTML = filtered.map(renderCard).join('');
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    countEl.textContent = filtered.length === events.length
        ? `${events.length} upcoming show${events.length === 1 ? '' : 's'}`
        : `Showing ${filtered.length} of ${events.length} shows`;
}

searchInput.addEventListener('input', applyFilters);
stateSel.addEventListener('change', applyFilters);
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    stateSel.value = '';
    applyFilters();
});

applyFilters();
</script>
