<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --bg: #0f0f23;
    --card-bg: #16213e;
    --card-border: #1a1a3e;
    --text: #e8e8f0;
    --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

/* FanGenie banner */
.fangenie-banner {
    background: linear-gradient(90deg, #0b1336 0%, #1a1a2e 100%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 16px;
    text-align: center;
}
.fangenie-banner a {
    display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-size: 13px; color: var(--text-muted);
}
.fangenie-banner .powered-by { font-weight: 500; }
.fangenie-banner .fg-logo { height: 22px; vertical-align: middle; }
.fangenie-banner .fg-tagline { color: var(--text); font-weight: 600; }
.fangenie-banner a:hover .fg-tagline { color: var(--accent2); }

/* Header */
.site-header {
    background: linear-gradient(180deg, rgba(26,26,46,0.9), rgba(15,15,35,0.6));
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--card-border);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.site-header .logo {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.event-count { font-size: 14px; color: var(--text-muted); font-weight: 500; }
.event-count strong { color: var(--accent2); font-weight: 700; }

/* Hero */
.hero {
    text-align: center; padding: 56px 20px 32px; max-width: 920px; margin: 0 auto;
}
.hero h1 {
    font-family: 'Montserrat', sans-serif; font-size: clamp(32px, 6vw, 54px); font-weight: 800; letter-spacing: -1px;
    margin-bottom: 14px; line-height: 1.1;
}
.hero h1 .accent { background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--text-muted); font-size: 17px; max-width: 600px; margin: 0 auto; }

/* Controls */
.controls {
    max-width: 1100px; margin: 0 auto 32px; padding: 0 20px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 12px;
}
@media (max-width: 720px) {
    .controls { grid-template-columns: 1fr; }
}
.controls input, .controls select, .controls button {
    font-family: inherit; font-size: 15px; padding: 12px 16px;
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 10px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.controls input:focus, .controls select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233,69,96,0.18);
}
.controls button {
    cursor: pointer; background: var(--accent); border-color: var(--accent); color: white; font-weight: 600;
}
.controls button:hover { background: #d63751; border-color: #d63751; }

/* Grid */
.events-grid {
    max-width: 1200px; margin: 0 auto; padding: 0 20px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px;
}
.no-results {
    grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted);
    font-size: 17px;
}

/* Card */
.event-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.event-card:hover {
    transform: translateY(-4px); border-color: rgba(245,166,35,0.4);
    box-shadow: 0 18px 40px rgba(0,0,0,0.4);
}
.card-photo-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #0b0f1f; }
.card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    text-align: center; color: white; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 20px;
    letter-spacing: -0.4px; line-height: 1.15;
}
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-date { color: var(--accent2); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.card-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--text); }
.card-venue { color: var(--text-muted); font-size: 14px; }
.card-venue strong { color: var(--text); font-weight: 600; }
.card-meta {
    margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--text-muted);
}
.tag {
    display: inline-block; padding: 3px 9px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--text);
}
.btn-tix {
    margin-top: 12px; display: block; text-align: center;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    color: white; padding: 11px 16px; border-radius: 10px;
    font-weight: 700; font-size: 14px; letter-spacing: 0.3px;
    transition: filter 0.15s, transform 0.15s;
}
.btn-tix:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* Footer */
.site-footer {
    border-top: 1px solid var(--card-border); padding: 24px 20px; text-align: center;
    color: var(--text-muted); font-size: 13px;
}
.site-footer a { color: var(--accent2); }
</style>

document.getElementById('year').textContent = new Date().getFullYear();

const GRADIENTS = [
    'linear-gradient(135deg, #e94560 0%, #f5a623 100%)',
    'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)',
    'linear-gradient(135deg, #ff6a00 0%, #ee0979 100%)',
    'linear-gradient(135deg, #00b09b 0%, #96c93d 100%)',
    'linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%)',
    'linear-gradient(135deg, #4568dc 0%, #b06ab3 100%)',
    'linear-gradient(135deg, #ff512f 0%, #dd2476 100%)',
    'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
    'linear-gradient(135deg, #fc466b 0%, #3f5efb 100%)',
    'linear-gradient(135deg, #f7971e 0%, #ffd200 100%)'
];
function gradientFor(slug) {
    let hash = 0;
    for (let i = 0; i < slug.length; i++) {
        hash = ((hash << 5) - hash) + slug.charCodeAt(i);
        hash |= 0;
    }
    return GRADIENTS[Math.abs(hash) % GRADIENTS.length];
}

function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

function renderCard(e) {
    const grad = gradientFor(e.slug);
    const artistEsc = escapeHtml(e.artist);
    const dateText = formatDate(e.date);
    const showtime = e.showtime ? ` &middot; ${escapeHtml(e.showtime.trim())}` : '';
    const cityState = [e.city, e.state].filter(Boolean).map(escapeHtml).join(', ');
    const venue = escapeHtml(e.location || '');
    const platformTag = e.platform ? `<span class="tag">${escapeHtml(e.platform)}</span>` : '';
    return `
    <article class="event-card">
        <div class="card-photo-wrap">
            <img src="${PHOTO_BASE}${e.slug}.jpg" alt="${artistEsc}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-photo-fallback" style="display:none;background:${grad}">${artistEsc}</div>
        </div>
        <div class="card-body">
            <div class="card-date">${dateText}${showtime}</div>
            <div class="card-title">${artistEsc}</div>
            <div class="card-venue"><strong>${cityState}</strong>${venue ? '<br>' + venue : ''}</div>
            <div class="card-meta">${platformTag}</div>
            <a class="btn-tix" href="${escapeHtml(e.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
        </div>
    </article>`;
}

function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const st = document.getElementById('stateFilter').value;
    const grid = document.getElementById('grid');
    let filtered = events;
    if (st) filtered = filtered.filter(e => e.state === st);
    if (q) filtered = filtered.filter(e =>
        (e.artist || '').toLowerCase().includes(q) ||
        (e.city || '').toLowerCase().includes(q) ||
        (e.location || '').toLowerCase().includes(q) ||
        (e.platform || '').toLowerCase().includes(q)
    );
    document.getElementById('evCount').textContent = filtered.length;
    if (!filtered.length) {
        grid.innerHTML = '<div class="no-results">No shows match your filters. Try clearing them.</div>';
        return;
    }
    grid.innerHTML = filtered.map(renderCard).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('stateFilter').addEventListener('change', render);
document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('search').value = '';
    document.getElementById('stateFilter').value = '';
    render();
});

render();
</script>
