<meta property="og:description" content="Find live concerts, tribute bands, and music events near you. Browse upcoming shows and get tickets fast.">

<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --bg: #0f0f23;
    --card-bg: #16213e;
    --card-border: #1a1a3e;
    --text: #e8e8f0;
    --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.fangenie-banner {
    background: linear-gradient(90deg, #1f2a5b 0%, #2d3b8e 100%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 16px;
    text-align: center;
}
.fangenie-banner a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}
.fangenie-banner .powered-by {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 500;
}
.fangenie-banner .fg-logo {
    height: 22px;
    width: auto;
}
.fangenie-banner .fg-tagline {
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
}

header.site {
    padding: 22px 24px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1280px;
    margin: 0 auto;
}
.logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.count-pill {
    background: rgba(233, 69, 96, 0.12);
    color: var(--accent);
    border: 1px solid rgba(233, 69, 96, 0.25);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
}

.hero {
    text-align: center;
    padding: 36px 24px 18px;
    max-width: 1280px;
    margin: 0 auto;
}
.hero h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ffffff 0%, #c9c9e8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hero p {
    color: var(--text-muted);
    font-size: 16px;
}

.controls {
    max-width: 1280px;
    margin: 18px auto 8px;
    padding: 0 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}
.controls input,
.controls select,
.controls button {
    font-family: inherit;
    font-size: 14px;
    padding: 11px 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.controls input:focus,
.controls select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
}
.controls input { flex: 1 1 240px; min-width: 200px; }
.controls select { min-width: 160px; }
.controls button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    cursor: pointer;
    font-weight: 500;
}
.controls button:hover {
    color: var(--text);
    border-color: var(--accent);
}
.result-info {
    max-width: 1280px;
    margin: 4px auto 0;
    padding: 0 24px;
    color: var(--text-muted);
    font-size: 13px;
}

.grid {
    max-width: 1280px;
    margin: 18px auto 60px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.card:hover {
    transform: translateY(-3px);
    border-color: rgba(233, 69, 96, 0.4);
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
}
.card-photo-wrap {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
    background: #0a0a1c;
}
.card-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}
.card-photo-fallback {
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #ffffff;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    line-height: 1.2;
}
.card-body {
    padding: 14px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
}
.card-date {
    color: var(--accent2);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.card-artist {
    font-family: 'Montserrat', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
}
.card-meta {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.45;
}
.card-meta .pl { color: var(--text); font-weight: 500; }
.card-cta {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    color: #ffffff;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(233, 69, 96, 0.25);
}
.card-cta:hover { filter: brightness(1.08); }

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-muted);
    padding: 60px 24px;
    font-size: 15px;
}

footer.site {
    border-top: 1px solid var(--card-border);
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
}
footer.site a { color: var(--text-muted); }
footer.site a:hover { color: var(--accent); }

@media (max-width: 640px) {
    .hero { padding: 24px 16px 12px; }
    .controls { padding: 0 16px; }
    .grid { padding: 0 16px; gap: 14px; }
    header.site { padding: 18px 16px 6px; }
}
</style>
</head>

document.getElementById('footerYear').textContent = new Date().getFullYear();

const GRADIENTS = [
    'linear-gradient(135deg, #e94560 0%, #f5a623 100%)',
    'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)',
    'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
    'linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%)',
    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
    'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
    'linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%)',
    'linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%)',
];
function hashString(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h);
}
function pickGradient(slug) {
    return GRADIENTS[hashString(slug) % GRADIENTS.length];
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function formatDate(iso, fallback) {
    if (!iso) return fallback || '';
    try {
        const [y, m, d] = iso.split('-').map(n => parseInt(n, 10));
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) {
        return fallback || iso;
    }
}

function renderCard(ev) {
    const slug = ev.slug || 'event';
    const photoUrl = PHOTO_BASE + encodeURIComponent(slug) + '.jpg';
    const gradient = pickGradient(slug);
    const cityState = [ev.city, ev.state].filter(Boolean).join(', ');
    const venue = ev.location || '';
    const showtime = ev.showtime || '';
    const dateLabel = formatDate(ev.date, ev.displayDate);

    return `
    <article class="card">
        <div class="card-photo-wrap">
            <img src="${photoUrl}" alt="${escapeHtml(ev.artist)}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-photo-fallback" style="display:none;background:${gradient}">${escapeHtml(ev.artist)}</div>
        </div>
        <div class="card-body">
            <div class="card-date">${escapeHtml(dateLabel)}${showtime ? ' &middot; ' + escapeHtml(showtime) : ''}</div>
            <div class="card-artist">${escapeHtml(ev.artist)}</div>
            <div class="card-meta">
                ${cityState ? '<div>' + escapeHtml(cityState) + '</div>' : ''}
                ${venue ? '<div class="pl">' + escapeHtml(venue) + '</div>' : ''}
            </div>
            <a class="card-cta" href="${escapeHtml(ev.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
        </div>
    </article>`;
}

const grid = document.getElementById('eventsGrid');
const searchInput = document.getElementById('searchInput');
const stateFilter = document.getElementById('stateFilter');
const clearBtn = document.getElementById('clearBtn');
const resultInfo = document.getElementById('resultInfo');
const eventCountEl = document.getElementById('eventCount');

function render() {
    const q = searchInput.value.trim().toLowerCase();
    const st = stateFilter.value;
    const filtered = events.filter(ev => {
        if (st && ev.state !== st) return false;
        if (!q) return true;
        const hay = [ev.artist, ev.city, ev.state, ev.location, ev.platform, ev.displayDate].filter(Boolean).join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
    });
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No shows match your filters. Try clearing them.</div>';
    } else {
        grid.innerHTML = filtered.map(renderCard).join('');
    }
    resultInfo.textContent = (q || st)
        ? `Showing ${filtered.length} of ${events.length} shows`
        : `${events.length} upcoming shows`;
    eventCountEl.textContent = events.length;
}

searchInput.addEventListener('input', render);
stateFilter.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    stateFilter.value = '';
    render();
});

render();
</script>
