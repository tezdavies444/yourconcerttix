<style>
:root {
  --primary: #1a1a2e;
  --accent: #e94560;
  --accent2: #f5a623;
  --bg: #0f0f23;
  --card-bg: #16213e;
  --card-border: #1a1a3e;
  --text: #e8e8f0;
  --text-muted: #8888aa;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

.fangenie-banner {
  background: linear-gradient(90deg, #111133, #1a1a3e);
  border-bottom: 1px solid #2a2a4e;
  padding: 10px 16px;
  text-align: center;
}
.fangenie-banner a { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.fangenie-banner .powered-by { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.fangenie-banner .fg-logo { height: 22px; vertical-align: middle; }
.fangenie-banner .fg-tagline { font-size: 13px; color: var(--text); font-weight: 500; }

header.site {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px;
  background: linear-gradient(180deg, var(--primary), transparent);
}
header.site .logo {
  font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 24px;
  letter-spacing: -0.5px; color: #fff;
}
header.site .logo .accent { color: var(--accent); }
header.site .event-count { font-size: 13px; color: var(--text-muted); font-weight: 500; }

.hero {
  text-align: center; padding: 48px 20px 24px; max-width: 900px; margin: 0 auto;
}
.hero h1 {
  font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 48px);
  margin: 0 0 12px; background: linear-gradient(90deg, #fff, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { color: var(--text-muted); font-size: 16px; margin: 0; }

.controls {
  max-width: 1200px; margin: 16px auto 32px; padding: 0 20px;
  display: grid; grid-template-columns: 1fr 200px auto; gap: 12px;
}
.controls input, .controls select, .controls button {
  background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 12px 14px; font-size: 14px; font-family: inherit;
}
.controls input:focus, .controls select:focus { outline: 2px solid var(--accent); border-color: transparent; }
.controls button { background: var(--accent); color: #fff; border: none; font-weight: 600; cursor: pointer; }
.controls button:hover { background: #d63950; }
@media (max-width: 700px) {
  .controls { grid-template-columns: 1fr; }
}

#grid {
  max-width: 1280px; margin: 0 auto; padding: 0 20px 48px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;
}
.card {
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card-photo-wrap { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #0c0c1a; }
.card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 14px; text-align: center;
  font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.card-artist { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; color: #fff; line-height: 1.25; }
.card-meta { font-size: 13px; color: var(--text-muted); }
.card-meta .where { color: var(--text); font-weight: 500; }
.card-actions { margin-top: 10px; }
.card-actions a.btn {
  display: inline-block; width: 100%; text-align: center;
  background: var(--accent); color: #fff; font-weight: 600;
  padding: 10px 14px; border-radius: 8px; font-size: 14px;
}
.card-actions a.btn:hover { background: #d63950; }

.no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); }

footer.site {
  text-align: center; padding: 28px 20px; font-size: 13px;
  color: var(--text-muted); border-top: 1px solid var(--card-border);
}
</style>

document.getElementById('yr').textContent = new Date().getFullYear();

// Gradient palette for fallback (10 colors paired)
const GRADIENT_PAIRS = [
  ['#e94560','#f5a623'],
  ['#5b6cff','#a855f7'],
  ['#22d3ee','#3b82f6'],
  ['#10b981','#0ea5e9'],
  ['#f43f5e','#a855f7'],
  ['#f59e0b','#ef4444'],
  ['#8b5cf6','#ec4899'],
  ['#06b6d4','#8b5cf6'],
  ['#ef4444','#f59e0b'],
  ['#14b8a6','#6366f1']
];
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function gradFor(slug) {
  const pair = GRADIENT_PAIRS[hashStr(slug) % GRADIENT_PAIRS.length];
  return `linear-gradient(135deg, ${pair[0]}, ${pair[1]})`;
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cardHtml(e) {
  const grad = gradFor(e.slug);
  const whereParts = [];
  if (e.city) whereParts.push(e.city);
  if (e.state) whereParts.push(e.state);
  const where = whereParts.join(', ');
  return `
    <article class="card">
      <div class="card-photo-wrap">
        <img src="${PHOTO_BASE}${esc(e.slug)}.jpg" alt="${esc(e.artist)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-photo-fallback" style="display:none;background:${grad}">${esc(e.artist)}</div>
      </div>
      <div class="card-body">
        <div class="card-artist">${esc(e.artist)}</div>
        <div class="card-meta">${esc(fmtDate(e.date))}${e.showtime ? ' · ' + esc(e.showtime) : ''}</div>
        <div class="card-meta"><span class="where">${esc(where)}</span>${e.location ? '<br>' + esc(e.location) : ''}</div>
        <div class="card-actions"><a class="btn" href="${esc(e.ticket)}" target="_blank" rel="noopener">Get Tickets</a></div>
      </div>
    </article>`;
}

const grid = document.getElementById('grid');
const noResults = document.getElementById('noResults');
const searchInput = document.getElementById('search');
const stateSelect = document.getElementById('stateFilter');
const countEl = document.getElementById('count');

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const st = stateSelect.value;
  const filtered = events.filter(e => {
    if (st && e.state !== st) return false;
    if (q) {
      const hay = (e.artist + ' ' + e.city + ' ' + e.location + ' ' + e.state).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  countEl.textContent = filtered.length;
  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    grid.innerHTML = filtered.map(cardHtml).join('');
  }
}

searchInput.addEventListener('input', render);
stateSelect.addEventListener('change', render);
document.getElementById('clearBtn').addEventListener('click', () => {
  searchInput.value = '';
  stateSelect.value = '';
  render();
});

render();
</script>
