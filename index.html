<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --bg: #0f0f23;
    --card-bg: #16213e;
    --card-border: #1a1a3e;
    --text: #e8e8f0;
    --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; line-height: 1.6; min-height: 100%; }

/* FanGenie banner */
.fangenie-banner { background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%); border-bottom: 1px solid rgba(233, 69, 96, 0.3); padding: 10px 20px; }
.fangenie-banner a { display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; color: var(--text); flex-wrap: wrap; }
.fangenie-banner .powered-by { font-size: 13px; color: var(--text-muted); letter-spacing: 0.5px; }
.fangenie-banner .fg-logo { height: 22px; width: auto; }
.fangenie-banner .fg-tagline { font-size: 13px; color: var(--accent2); font-weight: 500; }

/* Header */
.site-header { background: linear-gradient(180deg, rgba(26,26,46,0.95), rgba(15,15,35,0.95)); padding: 24px 20px; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); }
.header-inner { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.event-count { font-size: 14px; color: var(--text-muted); padding: 6px 14px; background: rgba(233, 69, 96, 0.1); border: 1px solid rgba(233, 69, 96, 0.3); border-radius: 20px; }
.event-count strong { color: var(--accent); }

/* Hero */
.hero { padding: 60px 20px 40px; text-align: center; background: radial-gradient(ellipse at center top, rgba(233, 69, 96, 0.15), transparent 70%); }
.hero h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(32px, 6vw, 56px); letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 12px; }
.hero h1 .accent { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero p { color: var(--text-muted); font-size: 18px; max-width: 600px; margin: 0 auto; }

/* Controls */
.controls { max-width: 1280px; margin: 0 auto; padding: 0 20px 32px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.controls input, .controls select { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 12px 16px; border-radius: 10px; font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.controls input { flex: 1; min-width: 220px; }
.controls select { min-width: 160px; cursor: pointer; }
.controls input:focus, .controls select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15); }
.controls input::placeholder { color: var(--text-muted); }
.clear-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 12px 18px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 14px; transition: all 0.2s; }
.clear-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Events grid */
.events-grid { max-width: 1280px; margin: 0 auto; padding: 0 20px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
.event-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; display: flex; flex-direction: column; }
.event-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(233, 69, 96, 0.3); border-color: rgba(233, 69, 96, 0.4); }
.card-photo-wrap { aspect-ratio: 16/9; overflow: hidden; position: relative; background: #0a0a1a; }
.card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px; color: #fff; letter-spacing: -0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); line-height: 1.15; }
.card-body { padding: 18px 18px 20px; display: flex; flex-direction: column; flex: 1; }
.card-artist { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.3px; margin-bottom: 8px; color: var(--text); }
.card-date { font-size: 14px; color: var(--accent2); font-weight: 600; margin-bottom: 4px; }
.card-showtime { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
.card-venue { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; flex: 1; }
.card-venue .city-state { color: var(--text); font-weight: 500; }
.card-cta { display: inline-block; background: linear-gradient(135deg, var(--accent), #d63752); color: #fff; text-decoration: none; padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; text-align: center; transition: filter 0.2s, transform 0.1s; letter-spacing: 0.3px; }
.card-cta:hover { filter: brightness(1.1); }
.card-cta:active { transform: scale(0.98); }

/* Empty state */
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state h3 { font-family: 'Montserrat', sans-serif; font-size: 22px; color: var(--text); margin-bottom: 8px; }

/* Footer */
.site-footer { background: var(--primary); padding: 28px 20px; text-align: center; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--card-border); }
.site-footer a { color: var(--accent); text-decoration: none; }
.site-footer a:hover { text-decoration: underline; }

@media (max-width: 600px) {

    .controls { padding-bottom: 24px; }
    .events-grid { gap: 18px; }
}

// Gradient palette for fallbacks (10 colors paired)
const GRADIENT_PAIRS = [
    ['#e94560', '#f5a623'],
    ['#667eea', '#764ba2'],
    ['#f093fb', '#f5576c'],
    ['#4facfe', '#00f2fe'],
    ['#43e97b', '#38f9d7'],
    ['#fa709a', '#fee140'],
    ['#30cfd0', '#330867'],
    ['#a8edea', '#fed6e3'],
    ['#ff9a9e', '#fad0c4'],
    ['#ffecd2', '#fcb69f']
];

function hashString(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i), h |= 0;
    return Math.abs(h);
}
function gradientFor(slug) {
    const pair = GRADIENT_PAIRS[hashString(slug) % GRADIENT_PAIRS.length];
    const angle = (hashString(slug + 'a') % 360);
    return `linear-gradient(${angle}deg, ${pair[0]}, ${pair[1]})`;
}
function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }
function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function renderCard(e) {
    const grad = gradientFor(e.slug);
    const cityState = [e.city, e.state].filter(Boolean).join(', ');
    return `
    <article class="event-card">
        <div class="card-photo-wrap">
            <img src="${PHOTO_BASE}${encodeURIComponent(e.slug)}.jpg" alt="${escapeAttr(e.artist)}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-photo-fallback" style="display:none;background:${grad}">${escapeHtml(e.artist)}</div>
        </div>
        <div class="card-body">
            <h3 class="card-artist">${escapeHtml(e.artist)}</h3>
            <div class="card-date">${escapeHtml(e.date_display || formatDate(e.date))}</div>
            ${e.showtime ? `<div class="card-showtime">${escapeHtml(e.showtime)}</div>` : ''}
            <div class="card-venue">
                ${cityState ? `<span class="city-state">${escapeHtml(cityState)}</span><br>` : ''}
                ${e.location ? escapeHtml(e.location) : ''}
            </div>
            <a class="card-cta" href="${escapeAttr(e.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
        </div>
    </article>`;
}

const grid = document.getElementById('eventsGrid');
const searchInput = document.getElementById('searchInput');
const stateFilter = document.getElementById('stateFilter');
const clearBtn = document.getElementById('clearBtn');
const eventCountEl = document.getElementById('eventCount');

function render() {
    const q = (searchInput.value || '').trim().toLowerCase();
    const stateVal = stateFilter.value;
    const filtered = events.filter(e => {
        if (stateVal && e.state !== stateVal) return false;
        if (!q) return true;
        return (e.artist + ' ' + e.city + ' ' + e.state + ' ' + e.location + ' ' + (e.platform || '')).toLowerCase().includes(q);
    });
    eventCountEl.textContent = filtered.length;
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state"><h3>No events match your search</h3><p>Try a different search term or clear the filters.</p></div>';
        return;
    }
    grid.innerHTML = filtered.map(renderCard).join('');
}

searchInput.addEventListener('input', render);
stateFilter.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    stateFilter.value = '';
    render();
});

render();
</script>
