<style>
  :root{
    --primary:#1a1a2e;
    --accent:#e94560;
    --accent2:#f5a623;
    --bg:#0f0f23;
    --card-bg:#16213e;
    --card-border:#1a1a3e;
    --text:#e8e8f0;
    --text-muted:#8888aa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .fangenie-banner{
    background:linear-gradient(90deg,#1a1a2e 0%,#16213e 100%);
    border-bottom:1px solid #2a2a4e;
    padding:10px 16px;
    text-align:center;
  }
  .fangenie-banner a{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .fangenie-banner .powered-by{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
  .fangenie-banner .fg-logo{height:24px;width:auto}
  .fangenie-banner .fg-tagline{font-size:13px;color:var(--text);font-weight:500}

  header{padding:36px 20px 18px;text-align:center;border-bottom:1px solid #1a1a3e}
  .logo{font-family:'Montserrat',sans-serif;font-weight:900;font-size:28px;letter-spacing:-0.5px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  .count-pill{margin-top:10px;display:inline-block;background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-muted);font-size:13px;padding:5px 12px;border-radius:999px}

  .hero{padding:48px 20px 24px;text-align:center;max-width:1200px;margin:0 auto}
  .hero h1{font-family:'Montserrat',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:14px}
  .hero p{color:var(--text-muted);font-size:17px;max-width:600px;margin:0 auto}

  .controls{max-width:1200px;margin:0 auto;padding:18px 20px 30px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
  .controls input,.controls select{font-family:inherit;font-size:15px;padding:11px 16px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);outline:none;transition:border-color .15s ease}
  .controls input{flex:1 1 320px;max-width:480px}
  .controls input::placeholder{color:var(--text-muted)}
  .controls input:focus,.controls select:focus{border-color:var(--accent)}
  .controls select{min-width:170px;cursor:pointer}
  .controls button{font-family:inherit;font-size:14px;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--card-border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s ease}
  .controls button:hover{color:var(--text);border-color:var(--accent)}

  .grid-wrap{max-width:1280px;margin:0 auto;padding:0 20px 60px}
  .results-meta{color:var(--text-muted);font-size:13px;margin-bottom:14px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}

  .card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(233,69,96,.15)}

  .card-photo-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a0a1a}
  .card-photo-wrap img{width:100%;height:100%;object-fit:cover}
  .card-photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.3px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);line-height:1.15}

  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-artist{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;line-height:1.2;color:var(--text)}
  .card-date{color:var(--accent2);font-weight:600;font-size:14px}
  .card-meta{color:var(--text-muted);font-size:13px;line-height:1.4}
  .card-meta .row{display:flex;gap:6px;align-items:flex-start;margin-top:3px}
  .card-meta .ico{flex-shrink:0;opacity:.7}

  .card-cta{margin-top:auto;padding-top:14px}
  .btn-tickets{display:block;width:100%;text-align:center;background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);color:#fff;font-weight:700;font-size:14px;padding:11px 14px;border-radius:8px;letter-spacing:.3px;transition:filter .15s ease;text-transform:uppercase}
  .btn-tickets:hover{filter:brightness(1.1)}

  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:15px}

  footer{padding:30px 20px;text-align:center;color:var(--text-muted);font-size:13px;border-top:1px solid var(--card-border);margin-top:20px}

  @media (max-width:560px){
    .fangenie-banner .fg-tagline{font-size:12px}
    .hero{padding:32px 20px 16px}
    .grid{grid-template-columns:1fr;gap:18px}
  }
</style>
</head>

const GRADIENTS = [
  'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',
  'linear-gradient(135deg,#f093fb 0%,#f5576c 100%)',
  'linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)',
  'linear-gradient(135deg,#43e97b 0%,#38f9d7 100%)',
  'linear-gradient(135deg,#fa709a 0%,#fee140 100%)',
  'linear-gradient(135deg,#30cfd0 0%,#330867 100%)',
  'linear-gradient(135deg,#a8edea 0%,#fed6e3 100%)',
  'linear-gradient(135deg,#ff9a9e 0%,#fad0c4 100%)',
  'linear-gradient(135deg,#5ee7df 0%,#b490ca 100%)',
  'linear-gradient(135deg,#ff6e7f 0%,#bfe9ff 100%)'
];

function hashSlug(s){
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function gradientFor(slug){
  return GRADIENTS[hashSlug(slug) % GRADIENTS.length];
}

function formatDate(ymd){
  if (!ymd) return '';
  const parts = ymd.split('-');
  if (parts.length !== 3) return ymd;
  const d = new Date(+parts[0], +parts[1]-1, +parts[2]);
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCard(ev){
  const slug = ev.slug;
  const grad = gradientFor(slug || ev.artist || 'x');
  const artist = escapeHtml(ev.artist);
  const dateText = ev.show_info ? escapeHtml(ev.show_info) : escapeHtml(formatDate(ev.date));
  const showtime = ev.showtime ? escapeHtml(ev.showtime) : '';
  const cityState = [ev.city, ev.state].filter(Boolean).map(escapeHtml).join(', ');
  const location = escapeHtml(ev.location || '');
  const ticket = escapeHtml(ev.ticket);

  return `
    <article class="card">
      <div class="card-photo-wrap">
        <img src="${PHOTO_BASE}${escapeHtml(slug)}.jpg" alt="${artist}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-photo-fallback" style="display:none;background:${grad}">${artist}</div>
      </div>
      <div class="card-body">
        <div class="card-artist">${artist}</div>
        <div class="card-date">${dateText}${showtime ? ' &middot; ' + showtime : ''}</div>
        <div class="card-meta">
          ${cityState ? `<div class="row"><span class="ico">&#128205;</span><span>${cityState}</span></div>` : ''}
          ${location ? `<div class="row"><span class="ico">&#127970;</span><span>${location}</span></div>` : ''}
        </div>
        <div class="card-cta">
          <a class="btn-tickets" href="${ticket}" target="_blank" rel="noopener">Get Tickets</a>
        </div>
      </div>
    </article>`;
}

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const stateFilter = document.getElementById('stateFilter');
const clearBtn = document.getElementById('clearBtn');
const countPill = document.getElementById('countPill');
const resultsMeta = document.getElementById('resultsMeta');

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const st = stateFilter.value;
  let filtered = events;
  if (st) filtered = filtered.filter(e => e.state === st);
  if (q) {
    filtered = filtered.filter(e =>
      (e.artist||'').toLowerCase().includes(q) ||
      (e.city||'').toLowerCase().includes(q) ||
      (e.state||'').toLowerCase().includes(q) ||
      (e.location||'').toLowerCase().includes(q)
    );
  }
  resultsMeta.textContent = filtered.length === events.length
    ? `Showing all ${events.length} upcoming shows`
    : `Showing ${filtered.length} of ${events.length} shows`;
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No shows match your search. Try clearing filters.</div>';
  } else {
    grid.innerHTML = filtered.map(renderCard).join('');
  }
}

searchInput.addEventListener('input', applyFilters);
stateFilter.addEventListener('change', applyFilters);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  stateFilter.value = '';
  applyFilters();
});

document.getElementById('year').textContent = new Date().getFullYear();
countPill.textContent = `${events.length} upcoming shows`;
applyFilters();
</script>
</body>
</html>
