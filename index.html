<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --bg: #0f0f23;
    --card-bg: #16213e;
    --card-border: #1a1a3e;
    --text: #e8e8f0;
    --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; min-height: 100vh; }

.fangenie-banner {
    background: linear-gradient(90deg, #1f2a4f 0%, #2a3a6b 100%);
    padding: 10px 16px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.fangenie-banner a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    flex-wrap: wrap;
    justify-content: center;
}
.fangenie-banner .powered-by { color: var(--text-muted); font-size: 13px; font-weight: 500; }
.fangenie-banner .fg-logo { height: 22px; width: auto; vertical-align: middle; }
.fangenie-banner .fg-tagline { color: var(--text); font-size: 13px; font-weight: 500; }

header {
    background: linear-gradient(180deg, var(--primary) 0%, rgba(26,26,46,0) 100%);
    padding: 28px 24px 24px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.event-count { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

.hero {
    text-align: center;
    padding: 36px 24px 24px;
    max-width: 920px;
    margin: 0 auto;
}
.hero h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 12px;
}
.hero p { color: var(--text-muted); font-size: 16px; }

.controls {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
}
.controls input, .controls select {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
    min-width: 220px;
}
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.controls input { flex: 1 1 280px; max-width: 480px; }
.controls select { flex: 0 0 auto; cursor: pointer; }
.btn-clear {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
}
.btn-clear:hover { color: var(--text); border-color: var(--accent); }

.events {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}
.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .18s, box-shadow .18s, border-color .18s;
}
.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    border-color: rgba(233,69,96,0.4);
}

.card-photo-wrap {
    aspect-ratio: 16/9;
    overflow: hidden;
    position: relative;
    background: var(--primary);
}
.card-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.card-photo-fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    line-height: 1.2;
}

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
.card-artist {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.25;
    margin-bottom: 8px;
    color: var(--text);
}
.card-date {
    color: var(--accent2);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
}
.card-time { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
.card-venue {
    color: var(--text);
    font-size: 14px;
    margin-bottom: 4px;
}
.card-loc {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 16px;
    flex: 1;
}
.card-cta {
    display: block;
    text-align: center;
    background: linear-gradient(90deg, var(--accent) 0%, #ff5f7e 100%);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    transition: transform .12s, box-shadow .12s;
}
.card-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(233,69,96,0.35);
}

footer {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.04);
}

@media (max-width: 600px) {
    .controls input, .controls select { min-width: 0; width: 100%; }
    .controls { flex-direction: column; align-items: stretch; }
    .btn-clear { width: 100%; }
}
</style>
</head>

const GRADIENTS = [
    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
    'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
    'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
    'linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%)',
    'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)',
    'linear-gradient(135deg, #e65c00 0%, #f9d423 100%)',
    'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)'
];

function gradientFor(slug) {
    let h = 0;
    for (let i = 0; i < slug.length; i++) {
        h = ((h << 5) - h) + slug.charCodeAt(i);
        h |= 0;
    }
    return GRADIENTS[Math.abs(h) % GRADIENTS.length];
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function escapeAttr(s) { return escapeHtml(s); }

function formatDate(yyyymmdd, fallback) {
    if (fallback) return fallback;
    try {
        const [y, m, d] = yyyymmdd.split('-').map(Number);
        const dt = new Date(y, m-1, d);
        return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
    } catch(e) { return yyyymmdd; }
}

function renderCard(ev) {
    const grad = gradientFor(ev.slug);
    const dateLabel = ev.showInfo || formatDate(ev.date);
    const cityState = [ev.city, ev.state].filter(Boolean).join(', ');
    return `
        <div class="card">
            <div class="card-photo-wrap">
                <img src="${PHOTO_BASE}${escapeAttr(ev.slug)}.jpg" alt="${escapeAttr(ev.artist)}" loading="lazy"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <div class="card-photo-fallback" style="background:${grad}">${escapeHtml(ev.artist)}</div>
            </div>
            <div class="card-body">
                <div class="card-artist">${escapeHtml(ev.artist)}</div>
                <div class="card-date">${escapeHtml(dateLabel)}</div>
                ${ev.showtime ? `<div class="card-time">${escapeHtml(ev.showtime)}</div>` : ''}
                ${cityState ? `<div class="card-venue">${escapeHtml(cityState)}</div>` : ''}
                ${ev.location ? `<div class="card-loc">${escapeHtml(ev.location)}</div>` : '<div class="card-loc"></div>'}
                <a class="card-cta" href="${escapeAttr(ev.ticket)}" target="_blank" rel="noopener">Get Tickets</a>
            </div>
        </div>
    `;
}

const grid = document.getElementById('eventsGrid');
const searchInput = document.getElementById('searchInput');
const stateFilter = document.getElementById('stateFilter');
const btnClear = document.getElementById('btnClear');
const eventCount = document.getElementById('eventCount');

function render() {
    const q = searchInput.value.trim().toLowerCase();
    const st = stateFilter.value;
    const filtered = events.filter(ev => {
        if (st && ev.state !== st) return false;
        if (!q) return true;
        return (
            (ev.artist || '').toLowerCase().includes(q) ||
            (ev.city || '').toLowerCase().includes(q) ||
            (ev.state || '').toLowerCase().includes(q) ||
            (ev.location || '').toLowerCase().includes(q)
        );
    });
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No shows match your search. Try clearing filters.</div>';
    } else {
        grid.innerHTML = filtered.map(renderCard).join('');
    }
    eventCount.textContent = `${filtered.length} of ${events.length} shows`;
}

searchInput.addEventListener('input', render);
stateFilter.addEventListener('change', render);
btnClear.addEventListener('click', () => {
    searchInput.value = '';
    stateFilter.value = '';
    render();
});

render();
</script>
