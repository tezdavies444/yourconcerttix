<style>
:root{
  --primary:#1a1a2e;
  --accent:#e94560;
  --accent2:#f5a623;
  --bg:#0f0f23;
  --card-bg:#16213e;
  --card-border:#1a1a3e;
  --text:#e8e8f0;
  --text-muted:#8888aa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* FanGenie banner */
.fangenie-banner{background:linear-gradient(90deg,#0a0a1e 0%,#13133a 100%);border-bottom:1px solid rgba(255,255,255,.06);padding:10px 16px;text-align:center;font-size:13px}
.fangenie-banner a{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;color:var(--text-muted);transition:color .2s}
.fangenie-banner a:hover{color:var(--text)}
.fangenie-banner .powered-by{font-weight:500;letter-spacing:.02em}
.fangenie-banner .fg-logo{height:22px;width:auto;vertical-align:middle;filter:brightness(1.15)}
.fangenie-banner .fg-tagline{color:var(--accent2);font-weight:500}

/* Header */
.site-header{padding:24px 20px 12px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.logo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff 0%,var(--accent2) 60%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.event-count{margin-top:6px;color:var(--text-muted);font-size:14px;font-weight:500}

/* Hero */
.hero{padding:40px 20px 24px;text-align:center}
.hero h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.1;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,#c8c8e0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:12px;color:var(--text-muted);font-size:16px;max-width:540px;margin-left:auto;margin-right:auto}

/* Filter controls */
.filters{display:flex;gap:10px;flex-wrap:wrap;max-width:1200px;margin:24px auto 0;padding:0 20px;align-items:center;justify-content:center}
.filters input,.filters select,.filters button{font-family:inherit;font-size:14px;padding:11px 14px;border-radius:8px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.filters input{flex:1 1 280px;min-width:200px}
.filters select{cursor:pointer;flex:0 1 160px}
.filters input:focus,.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,69,96,.15)}
.filters button{cursor:pointer;background:transparent;color:var(--text-muted);border-color:var(--card-border);transition:background .15s,color .15s,border-color .15s}
.filters button:hover{background:var(--card-bg);color:var(--text);border-color:var(--accent)}

.result-meta{max-width:1200px;margin:18px auto 0;padding:0 20px;color:var(--text-muted);font-size:13px;text-align:center;min-height:1.4em}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;max-width:1200px;margin:18px auto 60px;padding:0 20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4);border-color:rgba(233,69,96,.35)}
.card-photo-wrap{aspect-ratio:16/9;overflow:hidden;position:relative;background:#0a0a1e}
.card-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45);line-height:1.2;letter-spacing:.01em}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-artist{font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.005em;color:var(--text)}
.card-meta{font-size:13px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px;flex:1}
.card-meta .row{display:flex;gap:6px;align-items:flex-start}
.card-meta .label{flex:0 0 auto;color:var(--text-muted);opacity:.7;width:54px}
.card-meta .val{flex:1}
.card-cta{margin-top:10px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(90deg,var(--accent) 0%,#ff6f7d 100%);color:#fff;font-weight:600;font-size:14px;padding:10px 14px;border-radius:8px;transition:filter .15s,transform .15s}
.card-cta:hover{filter:brightness(1.08);transform:scale(1.01)}
.card-platform{margin-top:4px;font-size:11px;color:var(--text-muted);opacity:.6;text-transform:uppercase;letter-spacing:.05em;text-align:center}

.empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:15px;max-width:600px;margin:0 auto}

/* Footer */
.site-footer{padding:30px 20px;text-align:center;border-top:1px solid rgba(255,255,255,.04);color:var(--text-muted);font-size:13px}
.site-footer a{color:var(--accent2)}

@media (max-width:520px){
  .filters input{flex:1 1 100%}
  .filters select{flex:1 1 calc(50% - 5px)}
  .filters button{flex:1 1 calc(50% - 5px)}
  .hero{padding:28px 16px 16px}
  .grid{padding:0 14px;gap:14px}
}
</style>
</head>

const STATES = ["AZ", "CA", "FL", "IL", "MN", "NV", "PA"];

// 10-color gradient palette
const PALETTE = [
  ['#e94560','#f5a623'],
  ['#7c3aed','#ec4899'],
  ['#06b6d4','#3b82f6'],
  ['#10b981','#06b6d4'],
  ['#f59e0b','#ef4444'],
  ['#8b5cf6','#3b82f6'],
  ['#ec4899','#f5a623'],
  ['#22d3ee','#a855f7'],
  ['#fb7185','#7c3aed'],
  ['#facc15','#e94560'],
];

function hashCode(str){
  let h = 0;
  for (let i=0; i<str.length; i++){
    h = ((h<<5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}
function gradientFor(slug){
  const idx = hashCode(slug || 'x') % PALETTE.length;
  const [a,b] = PALETTE[idx];
  return 'linear-gradient(135deg, ' + a + ' 0%, ' + b + ' 100%)';
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function buildLocationLine(e){
  const parts = [];
  if (e.city) parts.push(e.city);
  if (e.state) parts.push(e.state);
  return parts.join(', ');
}

function cardHTML(e){
  const grad = gradientFor(e.slug);
  const dateTimeBits = [];
  if (e.displayDate) dateTimeBits.push(e.displayDate);
  if (e.showtime) dateTimeBits.push(e.showtime);
  const dateLine = dateTimeBits.join(' &middot; ');
  const loc = buildLocationLine(e);
  return ''
  + '<article class="card">'
  +   '<div class="card-photo-wrap">'
  +     '<img src="' + PHOTO_BASE + esc(e.slug) + '.jpg" alt="' + esc(e.artist) + '" loading="lazy"'
  +        ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
  +     '<div class="card-photo-fallback" style="display:none;background:' + grad + '">' + esc(e.artist) + '</div>'
  +   '</div>'
  +   '<div class="card-body">'
  +     '<div class="card-artist">' + esc(e.artist) + '</div>'
  +     '<div class="card-meta">'
  +       (dateLine ? '<div class="row"><span class="label">When</span><span class="val">' + dateLine + '</span></div>' : '')
  +       (loc ? '<div class="row"><span class="label">Where</span><span class="val">' + esc(loc) + '</span></div>' : '')
  +       (e.location ? '<div class="row"><span class="label">Venue</span><span class="val">' + esc(e.location) + '</span></div>' : '')
  +     '</div>'
  +     '<a class="card-cta" href="' + esc(e.ticket) + '" target="_blank" rel="noopener">Get Tickets &rarr;</a>'
  +     (e.platform ? '<div class="card-platform">via ' + esc(e.platform) + '</div>' : '')
  +   '</div>'
  + '</article>';
}

function populateStates(){
  const sel = document.getElementById('stateSelect');
  STATES.forEach(function(st){
    const opt = document.createElement('option');
    opt.value = st;
    opt.textContent = st;
    sel.appendChild(opt);
  });
}

function render(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const st = document.getElementById('stateSelect').value;
  let out = events;
  if (st) out = out.filter(function(e){ return e.state === st; });
  if (q){
    out = out.filter(function(e){
      const hay = (e.artist + ' ' + (e.city||'') + ' ' + (e.location||'') + ' ' + (e.state||'')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  const grid = document.getElementById('grid');
  if (!out.length){
    grid.innerHTML = '<div class="empty">No shows match your filters. Try clearing them.</div>';
  } else {
    grid.innerHTML = out.map(cardHTML).join('');
  }
  document.getElementById('resultMeta').textContent =
    (out.length === events.length)
      ? ''
      : ('Showing ' + out.length + ' of ' + events.length + ' shows');
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('year').textContent = new Date().getFullYear();
  populateStates();
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('stateSelect').addEventListener('change', render);
  document.getElementById('clearBtn').addEventListener('click', function(){
    document.getElementById('searchInput').value = '';
    document.getElementById('stateSelect').value = '';
    render();
  });
  render();
});
</script>
