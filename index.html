<style>
:root{
  --primary:#1a1a2e;
  --accent:#e94560;
  --accent2:#f5a623;
  --bg:#0f0f23;
  --card-bg:#16213e;
  --card-border:#1a1a3e;
  --text:#e8e8f0;
  --text-muted:#8888aa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

.fangenie-banner{
  background:linear-gradient(90deg,#0b0b1d 0%,#13132a 50%,#0b0b1d 100%);
  border-bottom:1px solid #22224a;
  padding:10px 16px;
  text-align:center;
}
.fangenie-banner a{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;color:var(--text)}
.fangenie-banner .powered-by{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em}
.fangenie-banner .fg-logo{height:22px;width:auto;filter:brightness(1.05)}
.fangenie-banner .fg-tagline{font-size:13px;color:var(--text);font-weight:500}

header{
  padding:28px 20px 18px;
  text-align:center;
  border-bottom:1px solid #1a1a3e;
}
.logo{
  font-family:'Montserrat',sans-serif;
  font-weight:900;
  font-size:clamp(28px,4vw,38px);
  letter-spacing:-0.02em;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.event-count{color:var(--text-muted);font-size:13px;margin-top:6px;letter-spacing:0.05em}

.hero{
  text-align:center;
  padding:46px 20px 26px;
  max-width:900px;
  margin:0 auto;
}
.hero h1{
  font-family:'Montserrat',sans-serif;
  font-weight:800;
  font-size:clamp(28px,5vw,46px);
  line-height:1.15;
  margin-bottom:10px;
  letter-spacing:-0.02em;
}
.hero p{color:var(--text-muted);font-size:16px;max-width:560px;margin:0 auto}

.controls{
  max-width:1200px;
  margin:0 auto;
  padding:0 20px 22px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}
.controls input,
.controls select,
.controls button{
  font-family:inherit;
  font-size:14px;
  background:var(--card-bg);
  color:var(--text);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:11px 14px;
  outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
}
.controls input{flex:1;min-width:220px}
.controls input:focus,
.controls select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,69,96,0.15)}
.controls button{
  cursor:pointer;
  background:transparent;
  color:var(--text-muted);
  border-color:#2a2a55;
}
.controls button:hover{color:var(--text);border-color:var(--accent)}

.events-grid{
  max-width:1280px;
  margin:0 auto;
  padding:0 20px 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,0.35);
  border-color:#2a2a5e;
}
.card-photo-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#11112a;
}
.card-photo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.card-photo-fallback{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  font-family:'Montserrat',sans-serif;
  font-weight:800;
  font-size:20px;
  letter-spacing:-0.01em;
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,0.45);
  line-height:1.15;
}
.card-body{
  padding:14px 16px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
}
.card-date{
  font-size:12px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--accent2);
}
.card-artist{
  font-family:'Montserrat',sans-serif;
  font-weight:800;
  font-size:18px;
  letter-spacing:-0.01em;
  line-height:1.2;
}
.card-meta{font-size:13px;color:var(--text-muted);line-height:1.45}
.card-meta .pill{display:inline-block;background:#1c2950;color:var(--text);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:6px}
.card-cta{
  margin-top:auto;
  display:block;
  text-align:center;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);
  color:#fff;
  font-weight:700;
  font-size:14px;
  padding:11px 14px;
  border-radius:10px;
  letter-spacing:0.02em;
}
.card-cta:hover{filter:brightness(1.08)}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--text-muted);
}

footer{
  text-align:center;
  padding:30px 20px 40px;
  color:var(--text-muted);
  font-size:13px;
  border-top:1px solid #1a1a3e;
}

@media (max-width:540px){
  .controls input{min-width:0;width:100%}
  .controls select,.controls button{flex:1}
}
</style>
</head>

document.getElementById('year').textContent = new Date().getFullYear();

const GRADIENTS = [
  'linear-gradient(135deg,#e94560 0%,#f5a623 100%)',
  'linear-gradient(135deg,#5e35b1 0%,#e94560 100%)',
  'linear-gradient(135deg,#1976d2 0%,#26c6da 100%)',
  'linear-gradient(135deg,#00897b 0%,#43a047 100%)',
  'linear-gradient(135deg,#6d4c41 0%,#f5a623 100%)',
  'linear-gradient(135deg,#7b1fa2 0%,#3949ab 100%)',
  'linear-gradient(135deg,#c2185b 0%,#7b1fa2 100%)',
  'linear-gradient(135deg,#ef6c00 0%,#e91e63 100%)',
  'linear-gradient(135deg,#0d47a1 0%,#1de9b6 100%)',
  'linear-gradient(135deg,#283593 0%,#e94560 100%)'
];

function gradientFor(str){
  let h = 0;
  for(let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return GRADIENTS[h % GRADIENTS.length];
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function formatDate(d){
  try{
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  }catch(e){ return d; }
}

function cardHtml(e){
  const grad = gradientFor(e.slug || e.artist);
  const photo = PHOTO_BASE + (e.slug || '') + '.jpg';
  const artist = escapeHtml(e.artist);
  const dateStr = escapeHtml(e.dateDisplay || formatDate(e.date));
  const showtime = e.showtime ? '<span class="pill">' + escapeHtml(e.showtime) + '</span>' : '';
  const cityState = [e.city, e.state].filter(Boolean).map(escapeHtml).join(', ');
  const location = e.location && e.location.trim() && e.location.replace(/[,\s]/g,'').length ? escapeHtml(e.location) : '';
  return '' +
    '<article class="card">' +
      '<div class="card-photo-wrap">' +
        '<img src="' + photo + '" alt="' + artist + '" loading="lazy" ' +
          'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
        '<div class="card-photo-fallback" style="display:none;background:' + grad + '">' + artist + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-date">' + dateStr + '</div>' +
        '<div class="card-artist">' + artist + '</div>' +
        '<div class="card-meta">' + showtime + (cityState ? escapeHtml(cityState).replace(/&amp;/g,'&') : '') + '</div>' +
        (location ? '<div class="card-meta">' + location + '</div>' : '') +
        '<a class="card-cta" href="' + escapeHtml(e.ticket) + '" target="_blank" rel="noopener">Get Tickets</a>' +
      '</div>' +
    '</article>';
}

function render(){
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const st = document.getElementById('stateFilter').value;
  const grid = document.getElementById('grid');
  const filtered = events.filter(e => {
    if(st && e.state !== st) return false;
    if(!q) return true;
    const hay = [e.artist,e.city,e.state,e.location,e.platform].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  if(!filtered.length){
    grid.innerHTML = '<div class="empty">No shows match your filters. Try clearing them.</div>';
    return;
  }
  grid.innerHTML = filtered.map(cardHtml).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('stateFilter').addEventListener('change', render);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  document.getElementById('stateFilter').value = '';
  render();
});

render();
</script>
