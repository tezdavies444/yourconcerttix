<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --bg: #0f0f23;

    --card-border: #1a1a3e;
    --text: #e8e8f0;
    --text-muted: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

.fangenie-banner {
    background: linear-gradient(90deg, #0a0a1a, #1a1a2e);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 10px 16px;
    text-align: center;
}
.fangenie-banner a { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.fangenie-banner .powered-by { color: var(--text-muted); font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }
.fangenie-banner .fg-logo { height: 22px; width: auto; }
.fangenie-banner .fg-tagline { color: var(--text); font-size: 13px; font-weight: 500; }

header.site-header {
    padding: 28px 24px 14px;

}
.logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 28px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
}
.event-count { color: var(--text-muted); font-size: 13px; margin-top: 6px; letter-spacing: 0.3px; }

.hero {
    padding: 48px 24px 24px;
    text-align: center;
    background: radial-gradient(ellipse at top, rgba(233,69,96,0.12), transparent 70%);
}
.hero h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: -1px;
    line-height: 1.1;
}
.hero p { color: var(--text-muted); margin-top: 12px; font-size: 16px; }

.controls {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 8px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}
.controls input, .controls select {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
}
.controls input { flex: 1 1 280px; min-width: 200px; }
.controls select { flex: 0 1 200px; }
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.controls button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
}
.controls button:hover { opacity: 0.9; }

.results-meta { max-width: 1280px; margin: 0 auto; padding: 4px 24px 12px; color: var(--text-muted); font-size: 13px; }

.events-grid {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 24px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
}
.card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease;
}
.card:hover { transform: translateY(-2px); border-color: rgba(233,69,96,0.4); }
.card-photo-wrap {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
    background: var(--primary);
}
.card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-fallback {
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 22px;
    line-height: 1.15;
    color: white;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-artist { font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 700; line-height: 1.25; }
.card-meta { color: var(--text-muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.card-meta .row { display: flex; gap: 6px; align-items: baseline; }
.card-meta .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; min-width: 52px; }
.card-meta .val { color: var(--text); font-size: 13px; }
.card-cta {
    margin-top: auto;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white;
    text-align: center;
    padding: 11px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    display: block;
}
.card-cta:hover { opacity: 0.92; }

.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }

footer {
    text-align: center;
    padding: 24px 16px 32px;
    color: var(--text-muted);
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.05);
}

@media (max-width: 600px) {
    .controls { flex-direction: column; align-items: stretch; }
    .controls input, .controls select, .controls button { width: 100%; }
}
</style>

// Gradient palette
const GRADIENTS = [
    'linear-gradient(135deg, #667eea, #764ba2)',
    'linear-gradient(135deg, #f093fb, #f5576c)',
    'linear-gradient(135deg, #4facfe, #00f2fe)',
    'linear-gradient(135deg, #43e97b, #38f9d7)',
    'linear-gradient(135deg, #fa709a, #fee140)',
    'linear-gradient(135deg, #30cfd0, #330867)',
    'linear-gradient(135deg, #a8edea, #fed6e3)',
    'linear-gradient(135deg, #ff9a9e, #fad0c4)',
    'linear-gradient(135deg, #ffecd2, #fcb69f)',
    'linear-gradient(135deg, #e94560, #f5a623)'
];

function hashSlug(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
}
function gradientFor(slug) { return GRADIENTS[hashSlug(slug || 'x') % GRADIENTS.length]; }

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

function cardHtml(e) {
    const grad = gradientFor(e.slug);
    const artistText = escapeHtml(e.artist);
    const ticket = escapeHtml(e.ticket);
    const dateDisplay = e.showInfo && e.showInfo.trim() ? escapeHtml(e.showInfo) : escapeHtml(fmtDate(e.date));
    const showtime = escapeHtml(e.showtime);
    const cityState = [e.city, e.state].filter(Boolean).map(escapeHtml).join(', ');
    const venue = escapeHtml(e.location);
    const photoUrl = PHOTO_BASE + encodeURIComponent(e.slug) + '.jpg';
    return `
      <article class="card">
        <div class="card-photo-wrap">
          <img src="${photoUrl}" alt="${artistText}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="card-photo-fallback" style="display:none;background:${grad}">${artistText}</div>
        </div>
        <div class="card-body">
          <div class="card-artist">${artistText}</div>
          <div class="card-meta">
            <div class="row"><span class="label">Date</span><span class="val">${dateDisplay}${showtime ? ' · ' + showtime : ''}</span></div>
            ${cityState ? `<div class="row"><span class="label">Where</span><span class="val">${cityState}</span></div>` : ''}
            ${venue ? `<div class="row"><span class="label">Venue</span><span class="val">${venue}</span></div>` : ''}
          </div>
          <a class="card-cta" href="${ticket}" target="_blank" rel="noopener">Get Tickets</a>
        </div>
      </article>`;
}

const grid = document.getElementById('eventsGrid');
const meta = document.getElementById('resultsMeta');
const searchInput = document.getElementById('searchInput');
const stateFilter = document.getElementById('stateFilter');
const clearBtn = document.getElementById('clearBtn');
const yearEl = document.getElementById('year');
yearEl.textContent = new Date().getFullYear();

function render() {
    const q = searchInput.value.trim().toLowerCase();
    const st = stateFilter.value;
    const filtered = events.filter(e => {
        if (st && e.state !== st) return false;
        if (!q) return true;
        const hay = [e.artist, e.city, e.state, e.location, e.platform].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
    });
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No events match your filters. Try clearing them.</div>';
    } else {
        grid.innerHTML = filtered.map(cardHtml).join('');
    }
    meta.textContent = `Showing ${filtered.length} of ${events.length} events`;
}

searchInput.addEventListener('input', render);
stateFilter.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    stateFilter.value = '';
    render();
});

render();
</script>
