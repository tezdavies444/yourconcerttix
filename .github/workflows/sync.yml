name: Sync from Airtable

on:
  # Run every 4 hours
  schedule:
    - cron: '0 */4 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch: {}
  # Run after each push to main that touches the script or workflow itself
  push:
    branches: [main]
    paths:
      - 'scripts/sync.mjs'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sync events + photos, rebuild index.html
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: |
          # Wipe old photos so bands that lost their Poster/Portrait
          # don't keep showing a stale image instead of the gradient fallback.
          rm -f artist-photos/*.jpg
          node scripts/sync.mjs

      - name: Commit & push if anything changed
        run: |
          git config user.name  "yct-sync-bot"
          git config user.email "yct-sync-bot@users.noreply.github.com"
          git add -A artist-photos index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync from Airtable ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
